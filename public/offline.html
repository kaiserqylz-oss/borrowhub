<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2563eb">
    <title>BorrowHub · Offline</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #0f172a; background: #f8fafc; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.25rem; }
        main { width: min(100%, 28rem); padding: 2rem; border: 1px solid #e2e8f0; border-radius: 1rem; background: white; text-align: center; }
        .mark { display: grid; width: 3.5rem; height: 3.5rem; margin: 0 auto 1.25rem; place-items: center; border-radius: .9rem; background: #2563eb; color: white; font-size: 2rem; font-weight: 800; }
        h1 { margin: 0; font-size: 1.6rem; }
        p { color: #475569; line-height: 1.65; }
        button { min-height: 2.75rem; padding: .65rem 1.1rem; border: 0; border-radius: .6rem; background: #2563eb; color: white; font: inherit; font-weight: 650; cursor: pointer; }
        button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
    </style>
</head>
<body><main><div class="mark" aria-hidden="true">B</div><h1>You’re offline</h1><p>BorrowHub needs an internet connection to load listings, account details, and submit changes. Your forms are not saved or sent while offline.</p><button type="button" onclick="window.location.reload()">Try again</button></main></body>
</html>
